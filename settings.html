<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .reply-box {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: scroll;
        }
		body {
        width: 400px; /* Adjust the width to your preference */
        padding: 20px;
    }
	
	.checkbox-container {
        position: relative;
        display: flex;
        align-items: center;
        z-index: 2; /* Ensures the checkbox is clickable */
    }

    .checkbox-container input[type="checkbox"] {
        margin-right: 10px; /* Puts the checkbox on the left */
        z-index: 3;
    }

    .clickable-div {
        position: relative;
        z-index: 1;
        width: 100%;
        cursor: pointer;
        padding: 10px;
        background-color: #f0f0f0;
    }

    .checkbox-container label {
        display: flex;
        width: 100%;
    }

    </style>
</head>
<body>
    <h3 class="mb-3">TEST</h3>

</body>
</html>
